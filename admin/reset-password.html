<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redefinir Senha | BioFidelidade SaaS</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="../css/style.css">

  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .auth-container {
      width: 100%;
      max-width: 440px;
    }
    .password-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .password-toggle-eye {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.1rem;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
    }
    .password-toggle-eye:hover {
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="auth-container">
    
    <!-- Logo Header -->
    <div style="text-align: center; margin-bottom: 1.5rem;">
      <a href="../index.html" style="font-size: 1.6rem; font-weight: 800; color: #fff; text-decoration: none;">
        ⚡ BioFidelidade
      </a>
      <p style="font-size: 0.88rem; color: var(--text-muted); margin-top: 0.25rem;">
        Redefinição Segura de Senha
      </p>
    </div>

    <div class="glass-card">
      <h3 style="font-size: 1.15rem; margin-bottom: 0.5rem; color: #fff;">🔒 Criar Nova Senha</h3>
      <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1.25rem;">
        Insira sua nova senha para atualizar seu acesso ao painel da sua empresa:
      </p>

      <form onsubmit="handleResetPassword(event)">
        <div class="form-group">
          <label class="form-label" for="new-password">Nova Senha</label>
          <div class="password-wrapper">
            <input type="password" id="new-password" class="form-control" placeholder="••••••••" required minlength="6" style="padding-right: 2.5rem;">
            <button type="button" class="password-toggle-eye" onclick="togglePasswordVisibility('new-password', this)" title="Mostrar/Ocultar Senha">👁️</button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm-password">Confirmar Nova Senha</label>
          <div class="password-wrapper">
            <input type="password" id="confirm-password" class="form-control" placeholder="••••••••" required minlength="6" style="padding-right: 2.5rem;">
            <button type="button" class="password-toggle-eye" onclick="togglePasswordVisibility('confirm-password', this)" title="Mostrar/Ocultar Senha">👁️</button>
          </div>
        </div>

        <button type="submit" class="btn-action btn-primary-action" style="margin-top: 0.5rem;">
          🔒 SALVAR NOVA SENHA
        </button>
      </form>
    </div>

    <div style="text-align: center; margin-top: 1.5rem;">
      <a href="login.html" style="font-size: 0.82rem; color: var(--text-muted);">← Ir para o Login</a>
    </div>

  </div>

  <script>
    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      if (!input) return;
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '🙈';
      } else {
        input.type = 'password';
        btn.textContent = '👁️';
      }
    }

    async function handleResetPassword(e) {
      e.preventDefault();
      const p1 = document.getElementById('new-password').value;
      const p2 = document.getElementById('confirm-password').value;

      if (p1 !== p2) {
        alert('As senhas não coincidem. Por favor, tente novamente.');
        return;
      }

      alert('🔒 Sua senha foi atualizada com sucesso! Redirecionando para o login...');
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
